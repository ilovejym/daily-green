name: Daily Green
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot label for this run (morning/afternoon/catchup/manual)'
        required: false
        default: 'manual'
permissions:
  contents: write
jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run green commits when due
        run: |
          set -e
          TODAY=$(TZ=America/New_York date +%F)
          NOW_H=$(TZ=America/New_York date +%H)
          NOW_MI=$(TZ=America/New_York date +%M)
          NOW_M=$((10#$NOW_H * 60 + 10#$NOW_MI))
          echo "Today $TODAY, now EST $(TZ=America/New_York date +%H:%M)"

          # One random point per window, derived from the date so every
          # hourly run of the same day agrees on the plan.
          SEED=$(TZ=America/New_York date -d "$TODAY" +%s)
          RANDOM=$SEED
          MH=$((8 + RANDOM % 5))
          MM=$((RANDOM % 60))
          AH=$((14 + RANDOM % 5))
          AM=$((RANDOM % 60))
          MORNING_M=$((MH * 60 + MM))
          AFTERNOON_M=$((AH * 60 + AM))
          echo "Plan: morning $(printf '%02d:%02d' "$MH" "$MM") EST, afternoon $(printf '%02d:%02d' "$AH" "$AM") EST"

          [ -f log.md ] || echo '# Daily log' > log.md
          COUNT=$(grep -cE "^$TODAY .* \(morning|afternoon|catchup\)$" log.md || true)
          echo "Scheduled runs today so far: $COUNT"

          # Each scheduled run makes 5 commits (10/day) so the day's
          # square shows dark green. Only the first line of a batch
          # carries the slot marker, so COUNT still counts runs, not commits.
          make_commits() {
            local slot="$1"
            local i
            git config user.name "ilovejym"
            git config user.email "355382654+ilovejym@users.noreply.github.com"
            for i in 1 2 3 4 5; do
              if [ "$i" -eq 1 ]; then
                echo "$(date -u +"%Y-%m-%d %H:%M UTC") ($slot)" >> log.md
              else
                echo "$(date -u +"%Y-%m-%d %H:%M UTC") $slot extra $((i - 1))/4" >> log.md
              fi
              git add log.md
              git commit -m "Daily green $TODAY ($slot $i/5)"
            done
            git push
          }

          SLOT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            [ -z "$SLOT" ] && SLOT="manual"
          elif [ "$NOW_M" -ge $((21 * 60)) ]; then
            # 21:00 EST review: top up to 2 scheduled runs for the day.
            while [ "$COUNT" -lt 2 ]; do
              make_commits "catchup"
              COUNT=$((COUNT + 1))
            done
            echo "Review done: $COUNT scheduled runs today"
            exit 0
          elif [ "$COUNT" -lt 2 ] && [ "$NOW_M" -ge "$MORNING_M" ] && ! grep -q "^$TODAY .* (morning)$" log.md; then
            SLOT="morning"
          elif [ "$COUNT" -lt 2 ] && [ "$NOW_M" -ge "$AFTERNOON_M" ] && ! grep -q "^$TODAY .* (afternoon)$" log.md; then
            SLOT="afternoon"
          fi

          if [ -z "$SLOT" ]; then
            echo "Nothing due yet"
            exit 0
          fi

          make_commits "$SLOT"
          echo "Committed $SLOT run for $TODAY (5 commits)"
